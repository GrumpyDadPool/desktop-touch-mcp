name: Sync Fork
on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Merge upstream default branch into fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/merge-upstream" \
            -f branch="${{ github.ref_name }}" \
            --jq '{message, merge_type}'
